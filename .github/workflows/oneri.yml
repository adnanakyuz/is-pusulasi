# Haftalık Tara görevi (Claude) yeni bulduklarını claude/... ile başlayan bir dala gönderir.
# Bu akış o dal için otomatik bir "öneri" (pull request) açar. Öneri, sahibi GitHub'da
# "Merge" düğmesine basmadan yayına girmez.
name: Tara önerisi aç

on:
  push:
    branches: ["claude/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  oneri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Öneri aç (yoksa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(gh pr list --head "$GITHUB_REF_NAME" --state open --json number --jq '.[].number')" ]; then
            ozet="$(git log -1 --pretty=%B)"
            gh pr create --base main --head "$GITHUB_REF_NAME" \
              --title "Tara önerisi: $(date +%d.%m.%Y)" \
              --body "$ozet

          ---
          Onaylamak için **Merge pull request** düğmesine bas; birkaç dakika içinde sitede görünür. İstemiyorsan **Close pull request** de, hiçbir şey değişmez."
          fi
