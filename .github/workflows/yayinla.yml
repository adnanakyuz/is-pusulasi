# Siteyi yayınla: main dalına her değişiklik geldiğinde sayfalar üretilir ve GitHub Pages'e konur.
# Tara görevinin açtığı öneriler (pull request) için yalnızca denetim çalışır; onaylanmadan yayına girmez.
name: Yayınla

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: yayin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  uret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sayfaları üret ve verileri denetle
        run: node scripts/uret.mjs
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  yayinla:
    needs: uret
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagit.outputs.page_url }}
    steps:
      - id: dagit
        uses: actions/deploy-pages@v4
